harnessfile: '0.2'
name: archon-workflow-builder
description: |
  Use when: User wants to create a new custom workflow for their project.
  Triggers: "build me a workflow", "create a workflow", "generate a workflow",
            "new workflow", "make a workflow for", "workflow builder".
  Does: Scans codebase -> extracts intent (JSON) -> generates YAML -> validates -> saves.
  NOT for: Editing existing workflows or creating non-workflow files.
steps:
  scan-codebase:
    bash: |
      echo "=== Existing Commands ==="
      if [ -d ".archon/commands" ]; then
        find .archon/commands -type f -name "*.md" 2>/dev/null | head -30
      else
        echo "(no .archon/commands/ directory)"
      fi

      echo ""
      echo "=== Existing Workflows ==="
      if [ -d ".archon/workflows" ]; then
        find .archon/workflows -type f \( -name "*.yaml" -o -name "*.yml" \) 2>/dev/null | head -30
      else
        echo "(no .archon/workflows/ directory)"
      fi

      echo ""
      echo "=== Package Info ==="
      if [ -f "package.json" ]; then
        grep -E '"name"|"scripts"' package.json | head -10
      else
        echo "(no package.json)"
      fi

      echo ""
      echo "=== Project Context (CLAUDE.md first 50 lines) ==="
      if [ -f "CLAUDE.md" ]; then
        head -50 CLAUDE.md
      else
        echo "(no CLAUDE.md)"
      fi
  extract-intent:
    prompt: |
      You are a workflow design classifier. Given a user's description of what they want
      a workflow to do, extract structured intent.

      ## User's Request
      $ARGUMENTS

      ## Codebase Context
      $scan-codebase.output

      ## Instructions

      Analyze the user's request and the existing codebase to determine:
      1. A kebab-case workflow name (e.g., "lint-and-test", "deploy-staging")
      2. A description following the Archon pattern (Use when / Triggers / Does / NOT for)
      3. Trigger phrases the router should match
      4. A list of proposed nodes with their types and purposes
      5. Whether this should be a simple DAG or include a loop node

      Be specific and concrete. Each proposed node should have a clear type
      (bash, prompt, command, or loop) and a one-line description of what it does.
    model: haiku
    allowed_tools: []
    output_format:
      type: object
      properties:
        workflow_name:
          type: string
        description:
          type: string
        trigger_phrases:
          type: string
        proposed_nodes:
          type: string
        execution_mode:
          type: string
          enum:
          - dag
          - loop
      required:
      - workflow_name
      - description
      - trigger_phrases
      - proposed_nodes
      - execution_mode
    depends_on:
    - scan-codebase
  generate-yaml:
    prompt: "You are an Archon workflow author. Generate a complete, valid workflow YAML file\nbased on the structured intent provided.\n\n## Intent\n- **Name**: $extract-intent.output.workflow_name\n-\
      \ **Description**: $extract-intent.output.description\n- **Trigger Phrases**: $extract-intent.output.trigger_phrases\n- **Proposed Nodes**: $extract-intent.output.proposed_nodes\n- **Execution Mode**:\
      \ $extract-intent.output.execution_mode\n\n## Original User Request\n$ARGUMENTS\n\n## Archon Workflow YAML Schema Reference\n\nA workflow YAML file has this structure:\n\n```yaml\nname: workflow-name\n\
      description: |\n  Use when: ...\n  Triggers: ...\n  Does: ...\n  NOT for: ...\n\n# Optional top-level settings:\n# provider: claude    (or codex)\n# model: sonnet       (or haiku, opus, etc.)\n# interactive:\
      \ true   (forces foreground execution in web UI)\n\nnodes:\n  - id: node-id-kebab-case\n    # Choose ONE of: prompt, bash, command, loop\n\n    # --- prompt node (AI-executed) ---\n    prompt: |\n\
      \      Instructions for the AI...\n    # Optional: model, allowed_tools, denied_tools, output_format, context, idle_timeout\n\n    # --- bash node (shell script, no AI, stdout = $<nodeId>.output)\
      \ ---\n    bash: |\n      #!/bin/bash\n      set -e\n      echo \"result\"\n\n    # --- command node (references a .archon/commands/ file) ---\n    command: command-name\n\n    # --- loop node (iterative\
      \ AI execution) ---\n    loop:\n      prompt: |\n        Instructions repeated each iteration...\n      until: COMPLETION_SIGNAL\n      max_iterations: 10\n      fresh_context: true  # optional: reset\
      \ context each iteration\n\n    # Common options for all node types:\n    depends_on: [other-node-id]       # DAG edges\n    when: \"$<other-node>.output == 'value'\"  # conditional execution\n  \
      \  trigger_rule: all_success          # all_success | one_success | all_done\n    timeout: 120000                    # ms, for bash nodes\n```\n\n## Variable Reference\n- `$ARGUMENTS` \u2014 user's\
      \ input text\n- `$ARTIFACTS_DIR` \u2014 pre-created directory for workflow artifacts\n- `$<nodeId>.output` \u2014 stdout from a bash node or AI response from a prompt node\n- `$<nodeId>.output.field`\
      \ \u2014 JSON field from a node with output_format\n- `$BASE_BRANCH` \u2014 base git branch\n\n## Rules\n1. The `name:` field MUST match: $extract-intent.output.workflow_name\n2. The `description:`\
      \ MUST follow the \"Use when / Triggers / Does / NOT for\" pattern\n3. Every node MUST have a unique kebab-case `id`\n4. Use `depends_on` to define execution order\n5. Use `bash` nodes for deterministic\
      \ operations (file checks, git commands, installs)\n6. Use `prompt` nodes for AI reasoning tasks\n7. Use `output_format` on prompt nodes when downstream nodes need structured data\n8. Use `allowed_tools:\
      \ []` on classification/analysis nodes that don't need tools\n9. Use `denied_tools: [Edit, Bash]` when a node should only use Write (not edit existing files)\n10. Prefer `model: haiku` for simple\
      \ classification tasks to save cost\n\n## Output\n\nWrite the complete workflow YAML to: `$ARTIFACTS_DIR/generated-workflow.yaml`\n\nUse the Write tool. Do NOT use Edit or Bash. The file must be valid\
      \ YAML and follow\nall the patterns above.\n"
    denied_tools:
    - Edit
    - Bash
    depends_on:
    - extract-intent
  validate-yaml:
    bash: |
      FILE="$ARTIFACTS_DIR/generated-workflow.yaml"

      if [ ! -f "$FILE" ]; then
        echo "ERROR: generated-workflow.yaml not found at $FILE"
        exit 1
      fi

      if [ ! -s "$FILE" ]; then
        echo "ERROR: generated-workflow.yaml is empty"
        exit 1
      fi

      if ! grep -q "^name:" "$FILE"; then
        echo "ERROR: missing 'name:' field"
        exit 1
      fi

      if ! grep -q "^nodes:" "$FILE"; then
        echo "ERROR: missing 'nodes:' field"
        exit 1
      fi

      echo "VALID"
    depends_on:
    - generate-yaml
  save-or-report:
    prompt: |
      You are a workflow installer. Save the generated workflow and report to the user.

      ## Workflow Details
      - **Name**: $extract-intent.output.workflow_name
      - **Trigger Phrases**: $extract-intent.output.trigger_phrases

      ## Instructions

      1. Read the generated workflow from `$ARTIFACTS_DIR/generated-workflow.yaml`
      2. Create the directory `.archon/workflows/` if it doesn't exist (use Bash: `mkdir -p .archon/workflows/`)
      3. Save the workflow to `.archon/workflows/$extract-intent.output.workflow_name.yaml`
         Use the Write tool to write the file.
      4. Report to the user:
         - Workflow name and file location
         - Trigger phrases that will invoke it
         - How to run it: `bun run cli workflow run $extract-intent.output.workflow_name "your input"`
         - How to test it: `bun run cli validate workflows $extract-intent.output.workflow_name`
    depends_on:
    - validate-yaml
