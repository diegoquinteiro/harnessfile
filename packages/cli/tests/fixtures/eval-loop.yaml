harnessfile: "0.1"

agents:
  spec-writer:
    model: anthropic/claude-sonnet-4-6
    instructions: Write a technical spec.

  reviewer:
    model: anthropic/claude-sonnet-4-6
    instructions: Review and approve.

steps:
  start:
    type: trigger
    event: webhook
    next: write-spec

  write-spec:
    agent: spec-writer
    eval:
      - metric: llm-judge
        type: llm
        prompt: "Is this spec complete?"
        pass: 0.8
    max-iterations: 3
    next: review

  review:
    agent: reviewer
