harnessfile: "0.2"
name: eval-loop

steps:
  start:
    type: trigger
    provider: webhook/v1
    event: webhook
    next: write-spec

  write-spec:
    agent: spec-writer
    eval:
      - metric: llm-judge
        type: llm
        prompt: "Is this spec complete?"
        pass: 0.8
    max-iterations: 3
    next: review

  review:
    agent: reviewer
