harnessfile: "0.1"

agents:
  planner:
    model: anthropic/claude-sonnet-4-6
    instructions: Plan the work.

  frontend-dev:
    model: anthropic/claude-sonnet-4-6
    instructions: Build frontend.

  backend-dev:
    model: anthropic/claude-sonnet-4-6
    instructions: Build backend.

  merger:
    model: anthropic/claude-sonnet-4-6
    instructions: Merge the results.

steps:
  plan:
    agent: planner
    next: [frontend, backend]

  frontend:
    agent: frontend-dev
    next: merge

  backend:
    agent: backend-dev
    next: merge

  merge:
    agent: merger
