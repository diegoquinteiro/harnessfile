harnessfile: "0.2"
name: fanout

runtimes:
  claude:
    protocol: claude-code/v1
  codex:
    protocol: codex-app-server/v1

steps:
  plan:
    agent: planner
    next: [frontend, backend]

  frontend:
    agent: frontend-dev
    next: merge

  backend:
    agent: backend-dev
    next: merge

  merge:
    agent: merger
