harnessfile: "0.1"

agents:
  researcher:
    model: anthropic/claude-sonnet-4-6
    instructions: Research the problem.

  writer:
    model: anthropic/claude-sonnet-4-6
    instructions: Write the report.

steps:
  start:
    type: trigger
    event: webhook
    next: research

  research:
    agent: researcher
    next: review

  review:
    type: gate
    approve: human
    channel: "#approvals"
    timeout: 1h
    fallback: reject
    next: write

  write:
    agent: writer
