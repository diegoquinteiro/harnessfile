harnessfile: "0.2"
name: pipeline

runtimes:
  claude:
    protocol: claude-code/v1
  codex:
    protocol: codex-app-server/v1

steps:
  start:
    type: trigger
    provider: webhook/v1
    event: webhook
    next: research

  research:
    agent: researcher
    next: write

  write:
    agent: writer
