harnessfile: "0.1"

agents:
  classifier:
    model: anthropic/claude-sonnet-4-6
    instructions: Classify the ticket.

  feature-dev:
    model: anthropic/claude-sonnet-4-6
    instructions: Build the feature.

  bug-fixer:
    model: anthropic/claude-sonnet-4-6
    instructions: Fix the bug.

steps:
  start:
    type: trigger
    event: webhook
    next: classify

  classify:
    type: router
    agent: classifier
    routes:
      feature: build
      bug: fix

  build:
    agent: feature-dev

  fix:
    agent: bug-fixer
