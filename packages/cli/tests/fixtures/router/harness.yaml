harnessfile: "0.2"
name: router

runtimes:
  claude:
    protocol: claude-code/v1
  codex:
    protocol: codex-app-server/v1

steps:
  start:
    type: trigger
    provider: webhook/v1
    event: webhook
    next: classify

  classify:
    type: router
    agent: classifier
    routes:
      feature: build
      bug: fix

  build:
    agent: feature-dev

  fix:
    agent: bug-fixer
