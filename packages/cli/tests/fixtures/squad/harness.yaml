harnessfile: "0.2"
name: squad-harness

runtimes:
  claude:
    protocol: claude-code/v1
  codex:
    protocol: codex-app-server/v1

triggers:
  issue-assigned:
    provider: webhook/v1
    event: issue-assigned
    next: dev-squad

steps:
  dev-squad:
    squad: development
    next: done

  done:
    type: output
    input: { summary: string }
