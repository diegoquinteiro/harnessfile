harnessfile: "0.2"
name: sync-plan

runtimes:
  claude:
    protocol: claude-code/v1
  codex:
    protocol: codex-app-server/v1

triggers:
  nightly-sweep:
    schedule: "0 3 * * *"
    timezone: UTC
    prompt: ./autopilots/nightly-sweep.md
    next: triage

steps:
  triage:
    agent: triager

  dev:
    squad: development

targets:
  multica:
    provider: multica/v1
    owns: [model, runtime, thinking-level, concurrency, env, mcp]
  claude-code:
    provider: claude-code/v1
  codex:
    provider: codex/v1
  github:
    provider: github-agent-hq/v1
